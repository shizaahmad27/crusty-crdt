name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer rustfmt
        run: rustup component add rustfmt
      - name: Sjekk formatering
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Kjør clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tester
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Bygg
        run: cargo build --workspace --verbose
      - name: Kjør tester
        run: cargo test --workspace --verbose

  docs:
    name: Dokumentasjon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Bygg docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  deploy-docs:
    name: Publiser docs til GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, clippy, fmt, docs]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Bygg docs
        run: cargo doc --workspace --no-deps
      - name: Legg til index-redirect
        run: echo '<meta http-equiv="refresh" content="0; url=crdt_lib/index.html">' > target/doc/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v4
